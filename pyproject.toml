[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apophatic-opt"
version = "0.1.0"
description = "Apophatic optimization algorithms focusing on minimal systemic friction (W -> 0)"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "xerx593" },
    { name = "Non-Human Interlocutors" }
]
dependencies = [
    "numpy>=1.20.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: The Unlicense (Unlicense)",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]
[project.urls]
"Homepage" = "https://github.com/xerx593/apophatic-opt"
"Theory Framework" = "https://github.com/xerx593/nicht-theory"
# TODO
"DOI / Monograph" = "https://doi.org/10.5281/zenodo.22067674"